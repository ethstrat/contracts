[profile.default]
libs = ["lib"]
names = true
sizes = true
via-ir = true
optimizer_runs = 999999 # Etherscan does not support verifying contracts with more optimization runs.
solc_version = "0.8.24"
ffi = true
fs_permissions = [
    {access = "write", path = "./tmp/"},
    {access = "read-write", path = "./script/deployments/1"},
]


[profile.default.invariant]
runs = 8
depth = 256
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true


[profile.build]
test = "/dev/null"
script = "/dev/null"


# [profile.test]
# via-ir = false


# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
