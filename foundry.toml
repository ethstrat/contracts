[profile.default]
test = "test/unit"
cache_path = "cache"
libs = ["lib"]
names = true
sizes = true
via-ir = true
optimizer_runs = 999999 # Etherscan does not support verifying contracts with more optimization runs.
solc_version = "0.8.24"
ffi = true
fs_permissions = [
    {access = "read-write", path = "./tmp/"},
    {access = "read-write", path = "./script/deployments/"},
]
# Disable network features to avoid system configuration issues in sandbox
evm_opts = { verbosity = 1 }

[profile.integration]
test = "test/integration"

[profile.default.fmt]
wrap_comments = true

[profile.build]
test = "/dev/null"
script = "/dev/null"

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config


